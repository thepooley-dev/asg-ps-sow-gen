<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <?!= include('_styles'); ?>
</head>
<body>
  <div class="app">
    <div class="app-header">
      <img class="logo" src="https://drive.google.com/thumbnail?id=1oXOlxJiZFUfg4l2Ogp5wMaFbdX4ThT67&sz=w400" alt="ASG Logo">
      <div class="title-group">
        <h1>Professional Services Scope of Work</h1>
        <p class="subtitle">Create a new SOW entry or edit an existing project.</p>
      </div>
    </div>
    <div id="chooserView">
      <div class="chooser-grid">
        <div class="card">
          <h2>Start a New Entry</h2>
          <p class="card-desc">Open the intake form to enter a brand-new project SOW.</p>
          <a class="btn btn-dark btn-block" id="newEntryBtn" href="#">
            New Entry &rarr;
          </a>
        </div>
        <div class="card">
          <h2>Edit an Existing Project</h2>
          <p class="card-desc">Search and update a saved SOW. Saving regenerates the document.</p>
          <div class="autocomplete-wrapper">
            <input type="text" id="projectInput" placeholder="Search projects..." autocomplete="off">
            <div id="projectList" class="autocomplete-list" role="listbox"></div>
          </div>
          <button class="btn btn-primary btn-block" id="editBtn" onclick="loadProjectForEdit()">Edit This Project</button>
          <p id="status" class="status-text"></p>
        </div>
      </div>
      <div style="text-align: center; margin-top: 24px;">
        <a class="btn btn-secondary" id="backHomeBtn" href="https://script.google.com/a/macros/asgllc.com/s/AKfycbzhSAG3B-6gRUua8Pyvphxl902OzdzfS2Lsvz6QpF_76ox24ciwrw1dDLg2uF0nF_6RLQ/exec" onclick="var u=this.href; this.textContent='Returning…'; this.style.pointerEvents='none'; window.top.location.href=u; return false;">&larr; Back to Home</a>
      </div>
    </div>
  </div>
  <script>
    var allProjects = <?!= JSON.stringify(getProjectList()) ?>;
    var webAppUrl = <?!= JSON.stringify(getWebAppUrl()) ?>;
    var selectedProject = "";
    var activeIndex = -1;
    var currentMatches = [];
    document.addEventListener('DOMContentLoaded', function() {
      const input = document.getElementById('projectInput');
      input.addEventListener('input', filterProjects);
      input.addEventListener('focus', filterProjects);
      input.addEventListener('keydown', handleAutocompleteKeys);
      document.addEventListener('click', function(e) {
        if (!e.target.closest('.autocomplete-wrapper')) closeList();
      });
      // "New Entry" -> NewDataPage via doGet(?page=new)
      const newEntryBtn = document.getElementById('newEntryBtn');
      if (newEntryBtn) {
        newEntryBtn.addEventListener('click', function(e) {
          e.preventDefault();
          newEntryBtn.style.pointerEvents = 'none';
          newEntryBtn.textContent = 'Opening…';
          window.top.location.href = webAppUrl + '?page=new';
        });
      }
    });
    // ============ AUTOCOMPLETE ============
    function filterProjects() {
      const query = document.getElementById('projectInput').value.toLowerCase().trim();
      currentMatches = allProjects.filter(function(name) {
        return name.toLowerCase().includes(query);
      });
      activeIndex = -1;
      renderList(currentMatches);
    }
    function renderList(items) {
      const listDiv = document.getElementById('projectList');
      listDiv.innerHTML = '';
      if (!items || items.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'autocomplete-empty';
        empty.textContent = allProjects.length === 0 ? 'No projects yet.' : 'No matches.';
        listDiv.appendChild(empty);
        listDiv.classList.add('open');
        return;
      }
      items.forEach(function(name, idx) {
        const option = document.createElement('div');
        option.className = 'autocomplete-item';
        option.textContent = name;
        option.setAttribute('role', 'option');
        option.addEventListener('mousedown', function(e) {
          e.preventDefault();
          selectItem(name);
        });
        option.addEventListener('mouseenter', function() {
          activeIndex = idx;
          updateActiveHighlight();
        });
        listDiv.appendChild(option);
      });
      listDiv.classList.add('open');
    }
    function updateActiveHighlight() {
      const items = document.getElementById('projectList').querySelectorAll('.autocomplete-item');
      items.forEach(function(el, idx) {
        el.classList.toggle('active', idx === activeIndex);
      });
      const active = items[activeIndex];
      if (active) active.scrollIntoView({ block: 'nearest' });
    }
    function handleAutocompleteKeys(e) {
      const listDiv = document.getElementById('projectList');
      if (!listDiv.classList.contains('open')) return;
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (activeIndex < currentMatches.length - 1) activeIndex++;
        updateActiveHighlight();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (activeIndex > 0) activeIndex--;
        updateActiveHighlight();
      } else if (e.key === 'Enter') {
        if (activeIndex >= 0 && currentMatches[activeIndex]) {
          e.preventDefault();
          selectItem(currentMatches[activeIndex]);
        }
      } else if (e.key === 'Escape') {
        closeList();
      }
    }
    function selectItem(name) {
      document.getElementById('projectInput').value = name;
      selectedProject = name;
      closeList();
    }
    function closeList() {
      document.getElementById('projectList').classList.remove('open');
      activeIndex = -1;
    }
    // ============ NAVIGATE TO EDIT ============
    function loadProjectForEdit() {
      const selected = selectedProject || document.getElementById('projectInput').value;
      const statusEl = document.getElementById('status');
      if (!selected) {
        statusEl.className = 'status-text error';
        statusEl.textContent = 'Please select a project first.';
        return;
      }
      const editBtn = document.getElementById('editBtn');
      editBtn.disabled = true;
      editBtn.textContent = 'Opening…';
      statusEl.className = 'status-text info';
      statusEl.textContent = 'Loading project...';
      window.top.location.href = webAppUrl + '?page=edit&project=' + encodeURIComponent(selected);
    }
  </script>
</body>
</html>
