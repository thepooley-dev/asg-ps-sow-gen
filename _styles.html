  <style>
    :root {
      --brand-blue: #0CA8E8;
      --brand-blue-dark: #0891C9;
      --brand-blue-tint: #E6F6FD;
      --black: #000000;
      --white: #FFFFFF;
      --gray-50: #F8F9FA;
      --gray-100: #F1F3F5;
      --gray-200: #E4E7EB;
      --gray-300: #CBD2D9;
      --gray-400: #9AA5B1;
      --gray-500: #7B8794;
      --gray-600: #52606D;
      --gray-700: #3E4C59;
      --gray-800: #26333F;
      --gray-900: #12181F;
      --danger: #D64545;
      --danger-dark: #B93636;
      --success: #22A06B;
      --radius: 6px;
      --radius-lg: 10px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--gray-50);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      color: var(--gray-900);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .app {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 24px 80px 24px;
    }
    /* ============ HEADER ============ */
    .app-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--gray-200);
    }
    .app-header .logo { height: 44px; width: auto; }
    .app-header .title-group h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: var(--black);
      letter-spacing: -0.01em;
    }
    .app-header .title-group .subtitle {
      margin: 2px 0 0 0;
      font-size: 13px;
      color: var(--gray-500);
    }
    /* ============ CHOOSER VIEW ============ */
    .chooser-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 720px) {
      .chooser-grid { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: 28px;
    }
    .card h2 {
      margin: 0 0 6px 0;
      font-size: 16px;
      font-weight: 600;
      color: var(--black);
    }
    .card .card-desc {
      margin: 0 0 20px 0;
      font-size: 13px;
      color: var(--gray-500);
    }
    /* ============ BUTTONS ============ */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 18px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, transform 0.05s ease;
      white-space: nowrap;
      text-decoration: none;
      line-height: 1;
    }
    .btn:focus-visible {
      outline: 2px solid var(--brand-blue);
      outline-offset: 2px;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--brand-blue); color: var(--white); }
    .btn-primary:hover:not(:disabled) { background: var(--brand-blue-dark); box-shadow: var(--shadow-md); }
    .btn-primary.is-destructive {
      background: var(--danger);
      border-color: var(--danger);
    }
    .btn-primary.is-destructive:hover:not(:disabled) {
      background: var(--danger-dark);
      border-color: var(--danger-dark);
      box-shadow: var(--shadow-md);
    }
    .btn-secondary {
      background: var(--white);
      color: var(--gray-800);
      border-color: var(--gray-300);
    }
    .btn-secondary:hover { background: var(--gray-50); border-color: var(--gray-400); }
    .btn-dark { background: var(--black); color: var(--white); }
    .btn-dark:hover:not(:disabled) { background: var(--gray-800); box-shadow: var(--shadow-md); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-block { width: 100%; }
    /* Inline spinner for buttons in "working" state */
    .btn-spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 8px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      vertical-align: -2px;
      animation: btn-spin 0.7s linear infinite;
      opacity: 0.85;
    }
    @keyframes btn-spin {
      to { transform: rotate(360deg); }
    }
    /* Prevent the button width from jumping when text changes */
    .btn.is-busy {
      min-width: var(--btn-busy-w, auto);
    }
    /* ============ AUTOCOMPLETE ============ */
    .autocomplete-wrapper { position: relative; margin-bottom: 12px; }
    .autocomplete-wrapper input {
      width: 100%;
      font-family: inherit;
      font-size: 14px;
      padding: 10px 12px 10px 36px;
      border: 1px solid var(--gray-300);
      border-radius: var(--radius);
      background: var(--white);
      color: var(--gray-900);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .autocomplete-wrapper input:focus {
      outline: none;
      border-color: var(--brand-blue);
      box-shadow: 0 0 0 3px rgba(12, 168, 232, 0.15);
    }
    .autocomplete-wrapper::before {
      content: "";
      position: absolute;
      left: 12px;
      top: 50%;
      width: 14px;
      height: 14px;
      transform: translateY(-50%);
      border: 2px solid var(--gray-400);
      border-radius: 50%;
      pointer-events: none;
    }
    .autocomplete-wrapper::after {
      content: "";
      position: absolute;
      left: 22px;
      top: 22px;
      width: 6px;
      height: 2px;
      background: var(--gray-400);
      transform: rotate(45deg);
      transform-origin: left center;
      pointer-events: none;
    }
    .autocomplete-list {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      max-height: 260px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: var(--shadow-md);
    }
    .autocomplete-list.open { display: block; }
    .autocomplete-item {
      padding: 10px 12px;
      cursor: pointer;
      font-size: 14px;
      color: var(--gray-800);
      border-bottom: 1px solid var(--gray-100);
    }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover,
    .autocomplete-item.active {
      background: var(--brand-blue-tint);
      color: var(--gray-900);
    }
    .autocomplete-empty {
      padding: 12px;
      text-align: center;
      color: var(--gray-500);
      font-size: 13px;
    }
    /* ============ EDIT VIEW ============ */
    #editView { display: none; }
    .edit-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--gray-50);
      padding: 20px 0;
      margin: -20px 0 20px 0;
      border-bottom: 1px solid var(--gray-200);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .edit-header .heading-block { min-width: 0; flex: 1; }
    .edit-header .eyebrow {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--brand-blue);
      margin-bottom: 4px;
    }
    .edit-header h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: var(--black);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .edit-header .actions { display: flex; gap: 8px; }
    /* ============ SECTIONS ============ */
    .section {
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: 24px 28px;
      margin-bottom: 20px;
    }
    .section-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--gray-100);
    }
    .section-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--black);
      color: var(--white);
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
      align-self: center;
    }
    .section-title {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--black);
    }
    .section-hint {
      margin-left: auto;
      font-size: 12px;
      color: var(--gray-500);
    }
    /* ============ GRID / FIELDS ============ */
    .grid { display: grid; gap: 16px; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-3 { grid-template-columns: 2fr 3fr 1fr; }
    @media (max-width: 720px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }
    .field { display: flex; flex-direction: column; }
    .field.field-full { grid-column: 1 / -1; }
    .field label {
      font-size: 12px;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .field label .req { color: var(--brand-blue); font-weight: 700; }
    .field input,
    .field textarea {
      width: 100%;
      font-family: inherit;
      font-size: 14px;
      padding: 9px 12px;
      border: 1px solid var(--gray-300);
      border-radius: var(--radius);
      background: var(--white);
      color: var(--gray-900);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field input:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--brand-blue);
      box-shadow: 0 0 0 3px rgba(12, 168, 232, 0.15);
    }
    .field textarea {
      min-height: 84px;
      resize: vertical;
      font-family: inherit;
      line-height: 1.5;
    }
    .field input.has-error,
    .field textarea.has-error { border-color: var(--danger); }
    .field input.has-error:focus,
    .field textarea.has-error:focus {
      box-shadow: 0 0 0 3px rgba(214, 69, 69, 0.15);
    }
    .calc-amount {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-600);
      letter-spacing: 0.02em;
    }
    .field .error-msg {
      display: none;
      margin-top: 6px;
      font-size: 12px;
      color: var(--danger);
    }
    .field.has-error .error-msg { display: block; }
    .field .hint {
      margin-top: 6px;
      font-size: 12px;
      color: var(--gray-500);
    }
    .input-with-prefix,
    .input-with-suffix { position: relative; }
    .input-with-prefix input { padding-left: 26px; }
    .input-with-prefix .affix {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-500);
      font-size: 14px;
      pointer-events: none;
    }
    .input-with-suffix input { padding-right: 30px; }
    .input-with-suffix .affix {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-500);
      font-size: 14px;
      pointer-events: none;
    }
    /* ============ TOGGLE ============ */
    .toggle-group {
      display: inline-flex;
      background: var(--gray-100);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      padding: 3px;
      gap: 3px;
    }
    .toggle-group button {
      appearance: none;
      background: transparent;
      border: none;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-600);
      padding: 6px 18px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .toggle-group button:focus-visible {
      outline: 2px solid var(--brand-blue);
      outline-offset: 1px;
    }
    .toggle-group button:hover { color: var(--gray-900); }
    .toggle-group button.active {
      background: var(--white);
      color: var(--black);
      box-shadow: var(--shadow-sm);
    }
    .conditional-block {
      display: none;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px dashed var(--gray-200);
    }
    .conditional-block.visible { display: block; }
    /* ============ STATUS / TOAST ============ */
    .status-text {
      margin: 12px 0 0 0;
      font-size: 13px;
      min-height: 18px;
    }
    .status-text.info { color: var(--gray-600); }
    .status-text.error { color: var(--danger); }
    .status-text.success { color: var(--success); }
    .status-text.warn {
      color: #8a6d00;
      background: #fff8db;
      border: 1px solid #f1d97a;
      padding: 8px 10px;
      border-radius: 4px;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--black);
      color: var(--white);
      padding: 12px 18px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow-md);
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 200;
      max-width: 360px;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.toast-success { background: var(--success); }
    /* Error variant — styled as a sibling of .modal-card so a blocking
       validation error carries the same visual weight as the confirm modal. */
    .toast.toast-error {
      background: #ffffff;
      color: #0f172a;
      border: 1px solid rgba(214, 69, 69, 0.35);
      border-left: 4px solid var(--danger);
      padding: 18px 22px;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.5;
      max-width: 440px;
      border-radius: 10px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.18),
                  0 4px 10px rgba(214, 69, 69, 0.10);
      align-items: flex-start;
      gap: 12px;
    }
    .toast .toast-icon {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .toast.toast-error .toast-icon {
      width: 22px;
      height: 22px;
      background: var(--danger);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      margin-top: 1px;
      line-height: 1;
    }
    .footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 20px 4px 0 4px;
      flex-wrap: wrap;
    }
    .footer-actions .actions { display: flex; gap: 8px; }
    /* ============ UTILITIES ============ */
    .wb-hidden { display: none !important; }
    /* COMMENTED OUT — BoM removal: .bom-hidden rule disabled. */
    /* .bom-hidden { display: none !important; } */
  </style>
