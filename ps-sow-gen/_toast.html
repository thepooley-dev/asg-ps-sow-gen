<!-- Toast notification component -->
<!-- Provides a top-right transient status message used by all pages.
     Shared between NewDataPage and EditDataPage; contains both the
     markup and the showToast() helper so pages just need to include
     this file — no per-page toast wiring required.
     Timing: errors linger 6s so users can actually read + act; success
     and neutral messages disappear after 3.2s. -->
<div id="toast" class="toast" role="status" aria-live="polite">
  <span class="toast-icon">&check;</span>
  <span id="toastMsg">Saved.</span>
</div>
<script>
  // Module-scoped so successive showToast() calls can cancel the previous
  // auto-hide timer (a fast second toast shouldn't get truncated by the
  // first one's timeout firing halfway through).
  let toastTimer = null;
  // showToast(msg, variant)
  //   msg     - text to display
  //   variant - 'success' | 'error' | undefined (default/neutral)
  function showToast(msg, variant) {
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');
    toast.classList.remove('toast-success', 'toast-error');
    if (variant === 'success') toast.classList.add('toast-success');
    else if (variant === 'error') toast.classList.add('toast-error');
    toastMsg.textContent = msg;
    toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    // Errors linger longer since the user needs to actually read + act.
    const duration = variant === 'error' ? 6000 : 3200;
    toastTimer = setTimeout(function() {
      toast.classList.remove('show');
    }, duration);
  }
</script>
