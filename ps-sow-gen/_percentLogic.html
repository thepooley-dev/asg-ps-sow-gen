<script>
(function () {
  // ---- Config -------------------------------------------------------
  const PCT_FIELD_IDS  = ['f_bq1Pct', 'f_bq2Pct', 'f_bq3Pct', 'f_bq4Pct', 'f_bq5Pct'];
  const GUARD_FIELD_ID = 'f_includeBreakdown';
  const GUARD_YES      = 'Yes';
  // ---- State --------------------------------------------------------
  let wasOverHundred = false;
  // ---- Helpers ------------------------------------------------------
  function toNum(v) {
    if (typeof window.parseNumericValue === 'function') {
      return window.parseNumericValue(v);
    }
    const n = parseFloat(v);
    return isNaN(n) ? 0 : n;
  }
  function sumPercents() {
    return PCT_FIELD_IDS.reduce(function (acc, id) {
      const el = document.getElementById(id);
      return acc + (el ? toNum(el.value) : 0);
    }, 0);
  }
  // If the guard field doesn't exist on this page, treat the check as always on.
  // If it exists, only run the check when it's set to "Yes".
  function shouldCheck() {
    const guard = document.getElementById(GUARD_FIELD_ID);
    if (!guard) return true;
    return guard.value === GUARD_YES;
  }
  function openModal(id)  { const m = document.getElementById(id); if (m) m.classList.add('show'); }
  function closeModal(id) { const m = document.getElementById(id); if (m) m.classList.remove('show'); }
  function showOverModal(msg) {
    const msgEl = document.getElementById('percentOverMsg');
    if (msgEl) msgEl.textContent = msg;
    openModal('percentOverModal');
  }
  function showWarnModal(msg, onConfirm, onCancel) {
    const msgEl = document.getElementById('percentWarnMsg');
    if (msgEl) msgEl.textContent = msg;
    openModal('percentWarnModal');
    document.getElementById('percentWarnOk').onclick = function () {
      closeModal('percentWarnModal');
      if (typeof onConfirm === 'function') onConfirm();
    };
    document.getElementById('percentWarnCancel').onclick = function () {
      closeModal('percentWarnModal');
      if (typeof onCancel === 'function') onCancel();
    };
  }
  // ---- Public API ---------------------------------------------------
  // Live over-100% check (as-you-type). Uses transition guard so the
  // modal only pops on the ≤100 → >100 edge, not every keystroke.
  window.checkPercentOverLive = function () {
    if (!shouldCheck()) { wasOverHundred = false; return; }
    const total = sumPercents();
    const isOverNow = total > 100;
    if (isOverNow && !wasOverHundred) {
      showOverModal(
        'Cost breakdown percentages total ' + total +
        '% — must equal 100% or less. Please adjust before submitting.'
      );
    }
    wasOverHundred = isOverNow;
  };
  // Named alias so any existing code calling showPercentOverModal still works
  window.showPercentOverModal = showOverModal;
  // Submit-time check. Call this from your submit/save handler.
  //   guard != Yes (when guard exists) → straight to onConfirm
  //   total = 0                        → straight to onConfirm (nothing to check)
  //   total > 100                      → hard block (over modal shown, onBlock fired, onConfirm NOT called)
  //   total < 100                      → soft warn (user chooses; onConfirm on "Submit anyway")
  //   total = 100                      → straight to onConfirm
  window.checkPercentBeforeSubmit = function (onConfirm, onBlock) {
    if (!shouldCheck()) { if (typeof onConfirm === 'function') onConfirm(); return; }
    const total = sumPercents();
    if (total === 0) { if (typeof onConfirm === 'function') onConfirm(); return; }
    if (total > 100) {
      showOverModal(
        'Cost breakdown percentages total ' + total +
        '% — must equal 100% or less. Please adjust before submitting.'
      );
      if (typeof onBlock === 'function') onBlock();
      return;
    }
    if (total < 100) {
      showWarnModal(
        'Cost breakdown percentages total ' + total +
        '% — that\'s under 100%. Submit anyway?',
        onConfirm, null
      );
      return;
    }
    if (typeof onConfirm === 'function') onConfirm();
  };
  // ---- Wire up on ready --------------------------------------------
  document.addEventListener('DOMContentLoaded', function () {
    const okBtn = document.getElementById('percentOverOk');
    if (okBtn) okBtn.onclick = function () { closeModal('percentOverModal'); };
    PCT_FIELD_IDS.forEach(function (id) {
      const el = document.getElementById(id);
      if (el) el.addEventListener('input', window.checkPercentOverLive);
    });
    const guard = document.getElementById(GUARD_FIELD_ID);
    if (guard) {
      guard.addEventListener('change', function () {
        wasOverHundred = false;
        window.checkPercentOverLive();
      });
    }
    // Backdrop click dismisses either percent modal.
    ['percentOverModal', 'percentWarnModal'].forEach(function (id) {
      const overlay = document.getElementById(id);
      if (overlay) {
        overlay.addEventListener('click', function (e) {
          if (e.target === overlay) closeModal(id);
        });
      }
    });
    // Esc dismisses whichever percent modal is open.
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      ['percentOverModal', 'percentWarnModal'].forEach(function (id) {
        const m = document.getElementById(id);
        if (m && m.classList.contains('show')) closeModal(id);
      });
    });
  });
})();
</script>
