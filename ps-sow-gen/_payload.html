<script>
  // Shared payload builder. Both pages strip display-only formatting
  // (currency commas, trailing % sign) so the server receives clean values.
  // Callers on NewDataPage (doSubmit) and EditDataPage (save) use this
  // instead of their own field loop.
  function buildFormPayload() {
    const formData = {};
    FIELDS.forEach(function(f) {
      const el = document.getElementById(f.id);
      if (!el) return;
      const type = el.getAttribute ? el.getAttribute('data-type') : null;
      let val = el.value || '';
      if (type === 'currency' && val) {
        val = val.replace(/,/g, '');
      }
      if (type === 'percent' && val) {
        val = val.replace(/%/g, '').trim();
      }
      formData[f.formKey] = val;
    });
    return formData;
  }
</script>
