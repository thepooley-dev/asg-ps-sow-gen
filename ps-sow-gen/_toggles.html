<script>
  // Shared toggle handlers for "Multiple Install Sites?" and the quote
  // breakdown reveal. Both pages carry the same ids/markup for these, so the
  // logic lives here. EditDataPage additionally tracks dirty state after each
  // toggle; the typeof guard makes that a no-op on NewDataPage.
  function setMultiSites(val) {
    document.getElementById('f_multiSites').value = val;
    document.querySelectorAll('#multiSitesToggle button').forEach(function(b) {
      b.classList.toggle('active', b.getAttribute('data-value') === val);
    });
    document.getElementById('multiSitesBlock').classList.toggle('visible', val === 'Yes');
    if (val === 'No') {
      const addAddrEl = document.getElementById('f_addAddr');
      if (addAddrEl) addAddrEl.value = '';
    }
    if (typeof updateSaveButtonEnabled === 'function') updateSaveButtonEnabled();
  }

  function setBreakdown(val) {
    document.getElementById('f_includeBreakdown').value = val;
    document.querySelectorAll('#breakdownToggle button').forEach(function(b) {
      b.classList.toggle('active', b.getAttribute('data-value') === val);
    });
    document.getElementById('breakdownBlock').classList.toggle('visible', val === 'Yes');
    if (val === 'No') {
      ['f_bq1','f_bq1Summary','f_bq1Pct','f_bq2','f_bq2Summary','f_bq2Pct','f_bq3','f_bq3Summary','f_bq3Pct',
       'f_bq4','f_bq4Summary','f_bq4Pct','f_bq5','f_bq5Summary','f_bq5Pct']
        .forEach(function(id) {
          const el = document.getElementById(id);
          if (el) el.value = '';
        });
      updateBreakdownAmounts();
      refreshBq3Visibility();
    }
    if (typeof updateSaveButtonEnabled === 'function') updateSaveButtonEnabled();
  }
