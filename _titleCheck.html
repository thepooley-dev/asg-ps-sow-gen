<script>
  // Shared duplicate-title pre-check used by NewDataPage (create) and
  // EditDataPage (rename). The server-side createRow/updateRow guards remain
  // the authoritative backstop for race conditions.
  //
  // Edit-mode wrinkle: the row's OWN current title is not a collision. Pages
  // that care (Edit) define getEditExcludeTitle() returning that title; New
  // leaves it undefined so no exclusion applies.
  var existingProjectTitles = [];

  function loadExistingTitles() {
    google.script.run
      .withSuccessHandler(function(list) {
        existingProjectTitles = (list || []).map(function(t) {
          return String(t || '').trim().toLowerCase();
        });
      })
      .withFailureHandler(function() {
        existingProjectTitles = [];
      })
      .getProjectList();
  }

  function isDuplicateTitle(val) {
    const norm = String(val || '').trim().toLowerCase();
    if (!norm) return false;
    const exclude = (typeof window.getEditExcludeTitle === 'function')
      ? String(window.getEditExcludeTitle() || '').trim().toLowerCase()
      : '';
    if (exclude && norm === exclude) return false;
    return existingProjectTitles.indexOf(norm) !== -1;
  }

  // Returns true when the title is acceptable (blank or unique), false when
  // it collides with an existing project. Blank titles are considered
  // "valid" here — the required-field check in validateAll() handles empty.
  function checkProjectTitleDupe() {
    const el = document.getElementById('f_projectTitle');
    if (!el) return true;
    const val = (el.value || '').trim();
    if (!val) { clearTitleError(el); return true; }
    // If the list hasn't loaded yet, don't false-positive.
    // Server-side createRow/updateRow still catches duplicates at submit time.
    if (!existingProjectTitles.length) { clearTitleError(el); return true; }
    if (isDuplicateTitle(val)) {
      setTitleError(el, 'A project with this title already exists. Choose a different title, or go back and edit the existing project.');
      return false;
    }
    clearTitleError(el);
    return true;
  }
</script>
