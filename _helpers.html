<script>
  // General numeric parser — strips $, %, commas, spaces, etc.
  window.parseNumericValue = function (str) {
    if (!str) return 0;
    const num = parseFloat(String(str).replace(/[^0-9.\-]/g, ''));
    return isNaN(num) ? 0 : num;
  };
  // Force the chooser (or any Apps Script web app URL) to reload fresh,
  // bypassing browser + edge cache. Uses a timestamp param that Apps Script
  // safely ignores.
  window.withCacheBust = function(url) {
    if (!url) return url;
    var sep = url.indexOf('?') === -1 ? '?' : '&';
    return url + sep + '_ts=' + Date.now();
  };
</script>
