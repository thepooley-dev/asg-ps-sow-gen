<!--
  Shared result overlay used by pages that save + regenerate a document.
  Opened on-demand by openResultOverlay(...).
  Usage:
    openResultOverlay({
      variant:     'success' | 'warning',   // default 'success'
      heading:     string,                  // h2 text
      body:        string,                  // main paragraph text
      docUrl:      string,                  // success variant only:
                                            //   renders "View document" button
      warningText: string,                  // warning variant only:
                                            //   renders yellow banner
    });
  Both variants render the "Return to Main Page" button, which calls the
  page-local returnToChooser() function. Every including page must define
  a returnToChooser().
-->
<div id="successOverlay" class="success-overlay" role="dialog" aria-modal="true" aria-labelledby="successHeading" hidden>
  <div class="success-card">
    <div class="success-check" aria-hidden="true">&#10003;</div>
    <h2 id="successHeading">Success</h2>
    <p id="successMessage">Your action completed.</p>
    <div id="successWarning" class="overlay-warning" hidden></div>
    <div id="successActions" class="overlay-actions"></div>
    <button type="button" class="btn btn-primary" id="returnToChooserBtn" onclick="returnToChooser()">
      Return to Main Page &rarr;
    </button>
  </div>
</div>
<script>
  window.openResultOverlay = function(opts) {
    var variant     = (opts && opts.variant) || 'success';
    var heading     = (opts && opts.heading)     ? String(opts.heading)     : '';
    var body        = (opts && opts.body)        ? String(opts.body)        : '';
    var docUrl      = (opts && opts.docUrl)      ? String(opts.docUrl)      : '';
    var warningText = (opts && opts.warningText) ? String(opts.warningText) : '';
    var overlay   = document.getElementById('successOverlay');
    var card      = overlay ? overlay.querySelector('.success-card') : null;
    var checkEl   = overlay ? overlay.querySelector('.success-check') : null;
    var headingEl = document.getElementById('successHeading');
    var messageEl = document.getElementById('successMessage');
    var warningEl = document.getElementById('successWarning');
    var actionsEl = document.getElementById('successActions');
    if (!overlay || !headingEl || !messageEl || !warningEl || !actionsEl) return;
    // Reset dynamic slots so a previous open can never leak into a new one.
    warningEl.textContent = '';
    warningEl.hidden = true;
    actionsEl.textContent = '';
    if (card) card.classList.remove('is-success', 'is-warning');
    if (variant === 'warning') {
      if (card) card.classList.add('is-warning');
      if (checkEl) checkEl.innerHTML = '!';
      headingEl.textContent = heading || 'Action completed (document pending)';
      messageEl.textContent = body    || 'The sheet was updated, but the document did NOT regenerate.';
      if (warningText) {
        warningEl.textContent = warningText;
        warningEl.hidden = false;
      }
    } else {
      if (card) card.classList.add('is-success');
      if (checkEl) checkEl.innerHTML = '&#10003;';
      headingEl.textContent = heading || 'Success';
      messageEl.textContent = body    || 'Your action completed.';
      if (docUrl) {
        var viewBtn = document.createElement('a');
        viewBtn.href = docUrl;
        viewBtn.target = '_blank';
        viewBtn.rel = 'noopener';
        viewBtn.className = 'btn btn-primary';
        viewBtn.textContent = 'View document';
        actionsEl.appendChild(viewBtn);
      }
    }
    overlay.hidden = false;
  };
</script>
